name: Training Tests

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-training:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Generate test dataset
      run: |
        python tests/generate_test_data.py

    - name: Test training script imports
      run: |
        python -c "from tools.train import main; print('Import successful')"

    - name: Run minimal training test (CPU, 2 iterations)
      run: |
        python tools/train.py configs/test_ci.py \
          --cfg-options train_cfg.max_iters=2 \
          default_hooks.checkpoint.interval=1 \
          default_hooks.logger.interval=1

    - name: Check training outputs
      run: |
        ls -la work_dirs/test_ci/
        test -f work_dirs/test_ci/iter_1.pth || exit 1
        test -f work_dirs/test_ci/iter_2.pth || exit 1
        echo "Training checkpoints created successfully"

    - name: Test resume training
      run: |
        python tools/train.py configs/test_ci.py \
          --resume work_dirs/test_ci/iter_2.pth \
          --cfg-options train_cfg.max_iters=3 \
          default_hooks.checkpoint.interval=1

    - name: Run basic unit tests
      run: |
        python tests/test_basic.py
        python tests/test_imports.py

  test-inference:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Test inference imports
      run: |
        python -c '
from basicvsrpp.inference import load_model, inference, get_default_gan_inference_config
from basicvsrpp import register_all_modules
import torch
import numpy as np

register_all_modules()
config = get_default_gan_inference_config()
print("Inference config created successfully")
print(f"Model type: {config[\"type\"]}")
'

    - name: Test model building
      run: |
        python -c '
from basicvsrpp.inference import get_default_gan_inference_config
from basicvsrpp import register_all_modules
from basicvsrpp.mmagic.registry import MODELS

register_all_modules()
config = get_default_gan_inference_config()
model = MODELS.build(config)
model.eval()
print(f"Model built successfully: {type(model).__name__}")
'
