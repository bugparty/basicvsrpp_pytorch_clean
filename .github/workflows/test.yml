name: Test BasicVSR++ Clean

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Test imports
      run: |
        python tests/test_imports.py

    - name: Test basic functionality
      run: |
        python tests/test_basic.py

    - name: Test end-to-end inference
      run: |
        python tests/test_end_to_end.py

    # Bootstrap only: once tests/golden/ is committed this is skipped, so a refactor
    # can never silently regenerate its own reference.
    - name: Generate golden data (only if missing)
      id: golden_gen
      if: matrix.python-version == '3.11' && hashFiles('tests/golden/golden.npz') == ''
      run: |
        python tests/generate_golden.py

    - name: Upload generated golden data
      if: steps.golden_gen.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: golden-data
        path: tests/golden/

    - name: Commit generated golden data (temporary bootstrap)
      if: steps.golden_gen.outcome == 'success' && github.event_name == 'push'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tests/golden
        git commit -m "Add golden regression data generated at ${GITHUB_SHA}"
        git push origin "HEAD:${GITHUB_REF_NAME}"

    - name: Test golden regression
      run: |
        python tests/test_golden.py

    - name: Check code syntax
      run: |
        python -m py_compile basicvsrpp/__init__.py
        python -m py_compile basicvsrpp/basicvsrpp_gan.py
        python -m py_compile basicvsrpp/inference.py
        python -m py_compile basicvsrpp/deformconv.py
